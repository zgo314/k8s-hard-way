apiVersion: v1
kind: Service
metadata:
  name: ztest
  labels:
    app: ztest
    service: webapp
spec:
  ports:
  - port: 80
    name: http
  selector:
    app: ztest
    service: webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ztest
  name: ztest
spec:
  replicas: 5
  selector:
    matchLabels:
      app: ztest
      service: webapp
  strategy: {}
  template:
    metadata:
      labels:
        app: ztest
        service: webapp
    spec:
#      nodeName: lima-vm1

#      nodeSelector:
