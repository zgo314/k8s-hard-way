##################################################################################################
# nginx service
##################################################################################################
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  labels:
    app: nginx
data:
  nginx.conf: |
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;


    events {
        worker_connections  1024;
    }


    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        #include /etc/nginx/conf.d/*.conf;

        # Empty (not "close") so normal requests reuse pooled connections to
        # backend, while WebSockets still upgrade.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        upstream backend_pool {
            server backend:9000;
            keepalive 32;
            keepalive_requests 1000;
            keepalive_timeout 60s;
        }

        server {
          listen 8080;
          listen [::]:8080;
          listen 8443;
          listen [::]:8443;

          location / {
            proxy_pass http://backend_pool;

            # REQUIRED: upgrade to HTTP/1.1 for keepalive to work
            proxy_http_version 1.1;

            # Clear the Connection header to prevent close semantics
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

          location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx
    service: nginx
  name: nginx
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: https
    port: 8443
    targetPort: 8443
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      version: v1
  template:
    metadata:
      labels:
        app: nginx
        version: v1
    spec:
      containers:
      - image: docker.io/nginxinc/nginx-unprivileged:1.31.2
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
        - containerPort: 8443
        volumeMounts:
        - name: nginx-configs
          readOnly: false
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      serviceAccountName: nginx
      volumes:
      - name: nginx-configs
        configMap:
          name: nginx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: backend
    service: backend
  name: backend
spec:
  ports:
  - name: http
    port: 9000
    targetPort: 8080
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
      - env:
        - name: USE_REAL_HOSTNAME
          value: "true"
        image: docker.io/mccutchen/go-httpbin:latest
        imagePullPolicy: IfNotPresent
        name: backend
        ports:
        - containerPort: 8080
      serviceAccountName: backend

